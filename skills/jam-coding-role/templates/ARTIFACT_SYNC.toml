version = 3
output_dir = ".ai/outgoing-artifacts"

[activation]
mode = "explicit"
require_confirm_stage_handoff = true

[selection]
include = [
  "logs_rl/**",
  "logs_eval/**",
  "outputs/**",
  "artifacts/**",
  "renders/**",
  "videos/**",
  "**/resolved_config*.yaml",
  "**/resolved_config*.yml",
  "**/metrics*.json",
  "**/summary*.json",
  "**/receipt*.json",
  "**/ledger*.md",
]
exclude = [
  "**/.env*",
  "**/*token*",
  "**/*secret*",
  "**/*credential*",
  "**/cache/**",
  "**/__pycache__/**",
]
checkpoint_patterns = ["**/*.pt", "**/*.pth", "**/*.ckpt", "**/*.onnx", "**/*.safetensors"]
include_checkpoints_default = false
max_file_bytes = 2147483648
max_bundle_bytes = 10737418240

[packaging]
# Default final compressed ZIP limit. Use a smaller value when the actual
# destination requires it; this is not a universal connector limit.
max_single_zip_bytes = 99614720
strategy = "single-or-semantic-standard-zips"
index_filename = "BUNDLE_INDEX.md"
split_volume_archives = false

[upload]
# Fill only after the destination and this upload are authorized.
backend = "capability-router"
standing_authorization = ""
root_folder_id = ""
remote = ""
rclone_remote = ""

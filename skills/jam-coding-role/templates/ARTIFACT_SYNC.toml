version = 4
output_dir = ".ai/outgoing-artifacts"

[activation]
mode = "explicit"
require_confirm_stage_handoff = true

[selection]
include = [
  "logs_rl/**",
  "logs_eval/**",
  "outputs/**",
  "artifacts/**",
  "renders/**",
  "videos/**",
  "**/resolved_config*.yaml",
  "**/resolved_config*.yml",
  "**/metrics*.json",
  "**/summary*.json",
  "**/receipt*.json",
  "**/ledger*.md",
]
exclude = [
  "**/.env*",
  "**/*token*",
  "**/*secret*",
  "**/*credential*",
  "**/cache/**",
  "**/__pycache__/**",
]
checkpoint_patterns = ["**/*.pt", "**/*.pth", "**/*.ckpt", "**/*.onnx", "**/*.safetensors"]
include_checkpoints_default = false
max_file_bytes = 2147483648
max_bundle_bytes = 10737418240

[packaging]
# This is the final compressed size of each generated ZIP, not raw input size.
# Keep 5 MiB below the observed 100 MB connector boundary.
max_single_zip_bytes = 99614720
strategy = "single-or-semantic-standard-zips"
index_filename = "BUNDLE_INDEX.md"
split_volume_archives = false

[upload]
backend = "capability-router"
standing_authorization = "create-only-stage-artifacts"
root_folder_id = "1JWQrkkOrItsKlFUjfxsadUrOcXChGpOf"
remote = "gdrive"
rclone_remote = "gdrive"

[pro_review]
require_git_publish = true
git_remote = "origin"
prompt_filename = "PRO_REVIEW_PROMPT.md"
